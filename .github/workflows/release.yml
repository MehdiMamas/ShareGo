name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            artifact: ShareGo-android.apk
          - os: ubuntu-latest
            target: linux
            artifact: ShareGo-linux.tar.gz
          - os: macos-latest
            target: macos
            artifact: ShareGo-macos.dmg
          - os: macos-latest
            target: ios
            artifact: ShareGo-unsigned.ipa
          - os: windows-latest
            target: windows
            artifact: ShareGo-windows.zip
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux build packages
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libavahi-client-dev libavahi-common-dev

      - name: Android release keystore
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          fi

      - name: Build
        shell: bash
        run: |
          flutter pub get
          case "${{ matrix.target }}" in
            android)
              flutter build apk --release
              cp build/app/outputs/flutter-apk/app-release.apk ShareGo-android.apk
              ;;
            linux)
              flutter build linux --release
              tar -C build/linux/x64/release/bundle -czf ShareGo-linux.tar.gz .
              ;;
            macos)
              flutter build macos --release
              app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
              hdiutil create -volname ShareGo -srcfolder "$app" -ov -format UDZO ShareGo-macos.dmg
              ;;
            ios)
              flutter build ios --release --no-codesign
              rm -rf Payload
              mkdir Payload
              cp -R build/ios/iphoneos/Runner.app Payload/
              zip -r ShareGo-unsigned.ipa Payload
              rm -rf Payload
              ;;
            windows)
              flutter build windows --release
              powershell -NoProfile -Command "Compress-Archive -Path build\\windows\\x64\\runner\\Release\\* -DestinationPath ShareGo-windows.zip"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/ShareGo-android.apk
            dist/ShareGo-linux.tar.gz
            dist/ShareGo-macos.dmg
            dist/ShareGo-unsigned.ipa
            dist/ShareGo-windows.zip
