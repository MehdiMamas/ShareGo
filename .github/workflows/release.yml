name: Release

on:
  push:
    tags:
      - "v*"
  # a manual run builds everything but publishes nothing: no release, no TestFlight upload
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the Windows files with SignPath (each request is approved there by hand)
        type: boolean
        default: false

permissions:
  contents: write
  # SignPath reads the unsigned files from this run's artifacts
  actions: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows files are signed through SignPath (docs/CODE_SIGNING.md) on tags, or on a
      # manual run with sign checked, once the SIGNPATH_ORGANIZATION_ID variable is set
      SIGN_WINDOWS: ${{ matrix.target == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != '' && (github.ref_type == 'tag' || inputs.sign) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            artifact: ShareGo-android.apk
          - os: ubuntu-latest
            target: linux
            artifact: ShareGo-linux.tar.gz
          - os: macos-latest
            target: macos
            artifact: ShareGo-macos.dmg
          - os: macos-latest
            target: ios
            artifact: ShareGo-unsigned.ipa
          - os: windows-latest
            target: windows
            artifact: |
              ShareGo-windows.zip
              ShareGo-windows-setup.exe
              ShareGo-windows.msi
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux build packages
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libavahi-client-dev libavahi-common-dev

      - name: Android release keystore
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          fi

      - name: Apple signing keychain
        if: matrix.target == 'ios' || matrix.target == 'macos'
        env:
          P12_BASE64: ${{ matrix.target == 'ios' && secrets.APPLE_DISTRIBUTION_P12_BASE64 || secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "No Apple signing secrets. Building unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/signing.p12"
          for ca in AppleWWDRCAG3 DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          if [ "${{ matrix.target }}" = ios ]; then
            echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
            uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
            for dir in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
              mkdir -p "$dir"
              cp "$RUNNER_TEMP/app.mobileprovision" "$dir/$uuid.mobileprovision"
            done
            echo "IOS_PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_ENV"
          fi
          echo "APPLE_SIGNING=1" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          flutter pub get
          case "${{ matrix.target }}" in
            android)
              flutter build apk --release
              cp build/app/outputs/flutter-apk/app-release.apk ShareGo-android.apk
              ;;
            linux)
              flutter build linux --release
              tar -C build/linux/x64/release/bundle -czf ShareGo-linux.tar.gz .
              ;;
            macos)
              flutter build macos --release
              app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
              if [ -n "${APPLE_SIGNING:-}" ]; then
                identity="Developer ID Application"
                find "$app/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) \
                  -exec codesign --force --timestamp --options runtime --sign "$identity" {} \;
                codesign --force --timestamp --options runtime \
                  --entitlements macos/Runner/Release.entitlements --sign "$identity" "$app"
                codesign --verify --strict --deep --verbose=2 "$app"
              fi
              # the app next to a link to Applications, so installing or updating is one drag
              staging=$(mktemp -d)
              ditto "$app" "$staging/$(basename "$app")"
              ln -s /Applications "$staging/Applications"
              hdiutil create -volname ShareGo -srcfolder "$staging" -ov -format UDZO ShareGo-macos.dmg
              if [ -n "${APPLE_SIGNING:-}" ]; then
                codesign --timestamp --sign "$identity" ShareGo-macos.dmg
                xcrun notarytool submit ShareGo-macos.dmg --wait \
                  --key ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8 \
                  --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
                xcrun stapler staple ShareGo-macos.dmg
              fi
              ;;
            ios)
              flutter build ios --release --no-codesign
              rm -rf Payload
              mkdir Payload
              cp -R build/ios/iphoneos/Runner.app Payload/
              zip -r ShareGo-unsigned.ipa Payload
              rm -rf Payload
              if [ -n "${APPLE_SIGNING:-}" ]; then
                cat >> ios/Flutter/Release.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $IOS_PROFILE_NAME
          EOF
                plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
                plutil -insert method -string app-store-connect "$RUNNER_TEMP/ExportOptions.plist"
                plutil -insert teamID -string "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
                plutil -insert signingStyle -string manual "$RUNNER_TEMP/ExportOptions.plist"
                plutil -insert signingCertificate -string "Apple Distribution" "$RUNNER_TEMP/ExportOptions.plist"
                plutil -insert provisioningProfiles -dictionary "$RUNNER_TEMP/ExportOptions.plist"
                plutil -insert 'provisioningProfiles.com\.mehdimamas\.sharego' -string "$IOS_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
                flutter build ipa --release --build-number=${{ github.run_number }} \
                  --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
                ipa=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
                if [ "$GITHUB_REF_TYPE" = tag ]; then
                  xcrun altool --upload-app -t ios -f "$ipa" \
                    --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
                fi
              fi
              ;;
            windows)
              flutter build windows --release
              bundle=build/windows/x64/runner/Release
              # Flutter needs the Visual C++ runtime. Ship it so ShareGo starts on a PC without it.
              for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
                cp "/c/Windows/System32/$dll" "$bundle/"
              done
              full=$(sed -n 's/^version: *//p' pubspec.yaml)
              echo "WINDOWS_VERSION=${full%%+*}" >> "$GITHUB_ENV"
              echo "WINDOWS_BUILD_VERSION=$full" >> "$GITHUB_ENV"
              ;;
          esac

      # ShareGo.exe is signed first, so the zip and both installers carry the signed copy
      - name: Upload ShareGo.exe for signing
        id: unsigned-exe
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-exe
          path: build/windows/x64/runner/Release/ShareGo.exe
          if-no-files-found: error

      - name: Sign ShareGo.exe
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sharego
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          # an approver signs off by hand in SignPath
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe
          parameters: |
            version: ${{ toJSON(env.WINDOWS_BUILD_VERSION) }}

      - name: Windows packages
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $bundle = "$PWD\build\windows\x64\runner\Release"
          if ($env:SIGN_WINDOWS -eq 'true') { Copy-Item signed-exe\ShareGo.exe $bundle -Force }
          Push-Location $bundle
          7z a -tzip "$env:GITHUB_WORKSPACE\ShareGo-windows.zip" . | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:WINDOWS_VERSION" "/DSourceDir=$bundle" "/O$PWD" windows\installer\ShareGo.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix build -arch x64 -ext WixToolset.UI.wixext -d "Version=$env:WINDOWS_VERSION" -d "SourceDir=$bundle" -o ShareGo-windows.msi windows\installer\ShareGo.wxs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload installers for signing
        id: unsigned-installers
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-installers
          path: |
            ShareGo-windows-setup.exe
            ShareGo-windows.msi
          if-no-files-found: error

      - name: Sign installers
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sharego
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers
          parameters: |
            version: ${{ toJSON(env.WINDOWS_VERSION) }}

      - name: Check signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-installers\* . -Force
          foreach ($file in 'build\windows\x64\runner\Release\ShareGo.exe', 'ShareGo-windows-setup.exe', 'ShareGo-windows.msi') {
            $sig = Get-AuthenticodeSignature $file
            "$file $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { exit 1 }
          }

      - uses: actions/upload-artifact@v7
        with:
          # the release job only takes release-* artifacts, not the unsigned ones above
          name: release-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          body: |
            [Code signing policy](https://github.com/MehdiMamas/ShareGo/blob/main/docs/CODE_SIGNING.md) · [Privacy policy](https://github.com/MehdiMamas/ShareGo/blob/main/docs/PRIVACY.md)
          files: |
            dist/ShareGo-android.apk
            dist/ShareGo-linux.tar.gz
            dist/ShareGo-macos.dmg
            dist/ShareGo-unsigned.ipa
            dist/ShareGo-windows.zip
            dist/ShareGo-windows-setup.exe
            dist/ShareGo-windows.msi
