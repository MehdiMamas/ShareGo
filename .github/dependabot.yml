version: 2
# labels must already exist on the repo. a missing label makes dependabot comment on every pull request.
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    rebase-strategy: auto
    groups:
      dart:
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    rebase-strategy: auto
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
